name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ]
  # Refresh Google reviews + Instagram feed and redeploy on the 1st of every month, 00:00 UTC
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        working-directory: astro
        run: npm ci

      - name: Refresh Google reviews
        working-directory: astro
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/fetch-reviews.mjs

      # Pull the newest @sampadavr posts for the homepage "Life at Sampada VR" grid.
      # With neither secret set this is a no-op and the bundled src/data/instagram.json is used.
      - name: Refresh Instagram feed
        working-directory: astro
        env:
          INSTAGRAM_FEED_URL: ${{ secrets.INSTAGRAM_FEED_URL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/fetch-instagram.mjs

      - name: Build Astro site
        working-directory: astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

